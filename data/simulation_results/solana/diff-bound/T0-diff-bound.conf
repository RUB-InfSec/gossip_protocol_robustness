set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic

if (!exists("GOSSIP")) GOSSIP = "solana"
if (!exists("DIR")) DIR = "."

if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000
if (!exists("CHURN")) CHURN = "nochurn"

noadfile(deg)=sprintf("%s/latency-%s-ns%d-d%d-none-%s.csv", DIR, GOSSIP, NETWORKSIZE, deg, CHURN)
filename(deg, bound)=sprintf("%s/latency-%s-ns%d-d%d-f%s-%s.csv", DIR, GOSSIP, NETWORKSIZE, deg, bound, CHURN)
plotname=sprintf("%s/robust-diff_degree_bound-%s-ns%d-%s.eps", DIR, GOSSIP, NETWORKSIZE, CHURN)
legendname(deg, bound)=sprintf("{/Symbol b}=%s, d=%d", bound, deg)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",22px\""
ANN_FONT = "\",24px\""

set logscale x 
set xrange[0:10.0]
set yrange[*:1.0]
# set mytics 4
set style line 12 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 12
set grid ytics mytics back ls 12
set xtics font @TICS_FONT
set ytics 0, 0.2, 1.0 font @TICS_FONT
set mytics 2
set xlabel "Propagation Time t (s)" font @LABEL_FONT offset 0,-0.5
set ylabel "Quality (t)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
#
#f=0.33
# set key box lt 0 top right font @KEY_FONT width -2.4 samplen 3
#f=0.3
set key box lt 0 bottom right font @KEY_FONT width -2 samplen 3 columns 2

threshold=0.667
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 3.5,threshold+0.02 font @ANN_FONT
# set style textbox 1 opaque fc "yellow" noborder
# set label 2 sprintf("N=%d", NETWORKSIZE) boxed bs 1 textcolor rgbcolor "steelblue" at 5.2,0.95 font @ANN_FONT

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     noadfile(50)          u ($1/1000):3  w lines lt 1  lc rgbcolor "light-green" lw 2 t legendname(50, "0"),\
     noadfile(200)         u ($1/1000):3  w lines lt 14 lc rgbcolor "sea-green"   lw 2 t legendname(200, "0"),\
     filename(50, "0.1")   u ($1/1000):3  w lines lt 0  lc rgbcolor "plum"        lw 3 t legendname(50, "0.1"),\
     filename(200, "0.1")  u ($1/1000):3  w lines lt 3  lc rgbcolor "dark-violet" lw 2 t legendname(200, "0.1"),\
     filename(50, "0.2")   u ($1/1000):3  w lines lt 4  lc rgbcolor "light-blue"  lw 2 t legendname(50, "0.2"),\
     filename(200, "0.2")  u ($1/1000):3  w lines lt 6  lc rgbcolor "navy"        lw 2 t legendname(200, "0.2"),\
     filename(50, "0.3")   u ($1/1000):3  w lines lt 7  lc rgbcolor "khaki"       lw 2 t legendname(50, "0.3"),\
     filename(200, "0.3")  u ($1/1000):3  w lines lt 9  lc rgbcolor "orange"      lw 2 t legendname(200, "0.3")
#      filename(50, "0.33")  u ($1/1000):3  w lines lt 7  lc rgbcolor "khaki"       lw 2 t legendname(50, "0.33"),\
#      filename(200, "0.33") u ($1/1000):3  w lines lt 9  lc rgbcolor "orange"      lw 2 t legendname(200, "0.33")

