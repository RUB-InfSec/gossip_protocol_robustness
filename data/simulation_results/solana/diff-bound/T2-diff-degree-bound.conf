set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#

if (!exists("GOSSIP")) GOSSIP = "solana"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("CHURN")) CHURN = "0"
if (!exists("ADVERSARY")) ADVERSARY = "random"
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"

# *.csv: coverage, delay, sentBytes, #relay, #onlineNodes, blkStayTime 
# budget = 0:    2-7
# budget = 0.1:  8-13
# budget = 0.2:  14-19
# budget = 0.33: 20-25
# budget = 0.3:  26-31

filename(deg)=sprintf("%s/%s-%s-d%d-%s-c%s.csv", DIR, GOSSIP, ADVERSARY, deg, MSG_SIZE, CHURN)
plotname=sprintf("%s/ns_coverage-diff_degree_bound-%s-%s-%s-c%s.eps", DIR, GOSSIP, ADVERSARY, MSG_SIZE, CHURN)
legendname(adv, deg)=sprintf("{/Symbol b}=%s, d=%d", adv, deg)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [20:5000]
set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
set yrange [*:100]
# set mytics 4
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set mytics 2 
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4

#
threshold=2.0/3.0*100
#f=0.33
# set label 1 "BFT threshold" textcolor rgbcolor "gray40" at 22,threshold+4 font @ANN_FONT
#f=0.3
set label 1 "BFT threshold" textcolor rgbcolor "gray40" at 22,threshold-3 font @ANN_FONT
# set label 2 "f=0.5" textcolor rgbcolor "gray40" at 22,50+2 font @ANN_FONT
set key box lt 0 bottom left width -2 samplen 3.5 font @KEY_FONT

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename(50)  u 1:($8/$1*100)  w linespoints lt 0  lc rgbcolor "plum"        lw 3 pt 6  ps 2 t legendname("0.1",50),\
     filename(200) u 1:($8/$1*100)  w linespoints lt 3  lc rgbcolor "dark-violet" lw 2 pt 7  ps 2 t legendname("0.1",200),\
     filename(50)  u 1:($14/$1*100) w linespoints lt 4  lc rgbcolor "light-blue"  lw 2 pt 10 ps 2 t legendname("0.2",50),\
     filename(200) u 1:($14/$1*100) w linespoints lt 6  lc rgbcolor "navy"        lw 2 pt 11 ps 2 t legendname("0.2",200),\
     filename(50)  u 1:($26/$1*100) w linespoints lt 7  lc rgbcolor "khaki"       lw 2 pt 8  ps 2 t legendname("0.3", 50),\
     filename(200) u 1:($26/$1*100) w linespoints lt 9  lc rgbcolor "orange"      lw 2 pt 9  ps 2 t legendname("0.3", 200)
#      filename(50)  u 1:($20/$1*100) w linespoints lt 7  lc rgbcolor "khaki"       lw 2 pt 8  ps 2 t legendname("0.33", 50),\
#      filename(200) u 1:($20/$1*100) w linespoints lt 9  lc rgbcolor "orange"      lw 2 pt 9  ps 2 t legendname("0.33", 200)
