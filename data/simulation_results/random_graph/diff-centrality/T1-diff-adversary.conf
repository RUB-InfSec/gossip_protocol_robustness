set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic



if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("MODEL")) MODEL = "push"
if (!exists("CHURN")) CHURN = "nochurn"
if (!exists("DEGREE")) DEGREE = 8
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
# if (!exists("ADAPTIVE")) ADAPTIVE = "-adapt"
# if (!exists("CORR_DELAY")) CORR_DELAY = "-delay1"
if (!exists("ADAPTIVE")) ADAPTIVE = ""
if (!exists("CORR_DELAY")) CORR_DELAY = ""
if (!exists("BUDGET")) BUDGET = "0.33"

# *.csv: coverage, delay, sentBytes, #relay, #onlineNodes, blkStayTime 
# budget = 0:    2-7
# budget = 0.1:  8-13
# budget = 0.2:  14-19
# budget = 0.33: 20-25
# budget = 0.5:  26-31
if (BUDGET eq "0.1") {
    ind = 9
} else {
    if (BUDGET eq "0.2") {
        ind = 15
    } else {
        if (BUDGET eq "0.33") {
            ind = 21 
        } else {
            if (BUDGET eq "0.5") {
                ind = 27
            } else {
                # for results in er-diffcent-f0.3 (only one column f=0.3 is available)
                ind = 3
            }
        }
    }
}

filename(adversary)=sprintf("%s/%s-%s-d%d-%s-%s-%s-%s%s%s.csv", DIR, GOSSIP, MODEL, DEGREE, adversary, BEHAVIOR, MSG_SIZE, CHURN, ADAPTIVE, CORR_DELAY)
plotname=sprintf("%s/ns_delay-diff_adversary-%s-%s-d%d-%s-%s-%s-f%s%s%s.eps", DIR, GOSSIP, MODEL, DEGREE, BEHAVIOR, MSG_SIZE, CHURN, BUDGET, ADAPTIVE, CORR_DELAY)
legendname(adversary)=sprintf("%s", adversary)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x 10
set xrange [20:5000]
set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
# set yrange [0.5:3]
set yrange [0:4]
set mytics 2
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Delay {/Symbol D} (s)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
# set format x "%g %%"  # not work because use xtic in plot
#
# set title "Network size vs. Delay"

#
#set key box top left height 0.6 spacing 1.2
set key box lt 0 top left font @KEY_FONT width -0.5 samplen 3

noadvfile=filename("random")
if (ind == 3) {
    noadvfile=sprintf("../plot-er-diffcent/%s-%s-d%d-random-%s-%s-nochurn.csv", GOSSIP, MODEL, DEGREE, BEHAVIOR, MSG_SIZE)
}

plot noadvfile             u 1:3              w linespoints lt 0 lc 6 lw 2.5 pt 6 ps 2 t legendname("none"),\
     filename("random")    u 1:(column(ind))  w linespoints lt 1 lc 7 lw 2 pt 3 ps 2 t legendname("random"),\
     filename("degree")    u 1:(column(ind))  w linespoints lt 2 lc 4 lw 2 pt 8 ps 2 t legendname("degree"),\
     filename("between")   u 1:(column(ind))  w linespoints lt 3 lc 2 lw 2 pt 7 ps 2 t legendname("betweenness"),\
     filename("closeness") u 1:(column(ind))  w linespoints lt 4 lc 1 lw 2 pt 5 ps 2 t legendname("closeness"),\
     filename("eigen")     u 1:(column(ind))  w linespoints lt 5 lc 3 lw 2 pt 4 ps 2 t legendname("eigenvector")


