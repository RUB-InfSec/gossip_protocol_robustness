set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("MODEL")) MODEL = "push"
if (!exists("CHURN")) CHURN = "nochurn"
if (!exists("DEGREE")) DEGREE = 8
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
# if (!exists("ADAPTIVE")) ADAPTIVE = "-adapt"
# if (!exists("CORR_DELAY")) CORR_DELAY = "-delay1"
if (!exists("ADAPTIVE")) ADAPTIVE = ""
if (!exists("CORR_DELAY")) CORR_DELAY = ""
if (!exists("BUDGET")) BUDGET = "0.33"

# *.csv: coverage, delay, sentBytes, #relay, #onlineNodes, blkStayTime 
# budget = 0:    2-7
# budget = 0.1:  8-13
# budget = 0.2:  14-19
# budget = 0.33: 20-25
# budget = 0.5:  26-31
if (BUDGET eq "0.1") {
    ind = 8
} else {
    if (BUDGET eq "0.2") {
        ind = 14 
    } else {
        if (BUDGET eq "0.33") {
            ind = 20
        } else {
            if (BUDGET eq "0.5") {
                ind = 26
            } else {
                ind = 2
            }
        }
    }
}

filename(adversary)=sprintf("%s/%s-%s-d%d-%s-%s-%s-%s%s%s.csv", DIR, GOSSIP, MODEL, DEGREE, adversary, BEHAVIOR, MSG_SIZE, CHURN, ADAPTIVE, CORR_DELAY)
plotname=sprintf("%s/ns_coverage-diff_adversary-%s-%s-d%d-%s-%s-%s-f%s%s%s.eps", DIR, GOSSIP, MODEL, DEGREE, BEHAVIOR, MSG_SIZE, CHURN, BUDGET, ADAPTIVE, CORR_DELAY)
legendname(adversary)=sprintf("%s", adversary)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [20:5000]
set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
#f=0.33
set yrange [62:67.1]
#f=0.3
# set yrange [65.5:70]
#f=0.32
# set yrange [64:68]
# set mytics 4
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
# set format x "%g %%"  # not work because use xtic in plot
#
# set title "Network size vs. Delay"

#
# set key spacing 1.5 width 3.5 height 0.6
#set key box top left height 0.6 spacing 1.2
set key box lt 0 bottom center maxrows 3 font @KEY_FONT

#f0.33
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,67-0.15 font @ANN_FONT
#f0.3
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,67-0.15 font @ANN_FONT
#f0.32
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,66.7-0.15 font @ANN_FONT

plot 66.7 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename("random")    u 1:(column(ind)/$1*100)  w linespoints lt 1 lc 7 lw 2 pt 3 ps 2 t legendname("random"),\
     filename("degree")    u 1:(column(ind)/$1*100)  w linespoints lt 2 lc 4 lw 2 pt 8 ps 2 t legendname("degree"),\
     filename("between")   u 1:(column(ind)/$1*100)  w linespoints lt 3 lc 2 lw 2 pt 7 ps 2 t legendname("betweenness"),\
     filename("closeness") u 1:(column(ind)/$1*100)  w linespoints lt 4 lc 1 lw 2 pt 5 ps 2 t legendname("closeness"),\
     filename("eigen")     u 1:(column(ind)/$1*100)  w linespoints lt 5 lc 3 lw 2 pt 4 ps 2 t legendname("eigenvector")
