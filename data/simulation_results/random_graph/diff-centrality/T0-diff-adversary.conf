set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."

if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000
if (!exists("MODEL")) MODEL = "push"
if (!exists("CHURN")) CHURN = "nochurn"
if (!exists("DEGREE")) DEGREE = 8
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
if (!exists("ADAPTIVE")) ADAPTIVE = "" #"-adapt"
if (!exists("CORR_DELAY")) CORR_DELAY = "" #"-delay1"
if (!exists("BUDGET")) BUDGET = "0.33"

filename(adv)=sprintf("%s/latency-%s-%s-ns%d-%s-d%d-f%s-%s-%s%s%s.csv", DIR, GOSSIP, MODEL, NETWORKSIZE, adv, DEGREE, BUDGET, BEHAVIOR, CHURN, ADAPTIVE, CORR_DELAY)
plotname=sprintf("%s/robust-diff_adversary-%s-%s-ns%d-d%d-f%s-%s-%s%s%s.eps", DIR, GOSSIP, MODEL, NETWORKSIZE, DEGREE, BUDGET, BEHAVIOR, CHURN, ADAPTIVE, CORR_DELAY)
legendname(adv)=sprintf("%s", adv)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set xrange[0:4.0]
set yrange[*:1.0]
# set mytics 4
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics 0, 0.2, 1.0 font @TICS_FONT
set mytics 2
set xlabel "Propagation Time t (s)" font @LABEL_FONT offset 0,-0.5
set ylabel "Quality (t)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4

threshold = 0.667
#
#set key box top left height 0.6 spacing 1.2
set key box lt 0 bottom right font @KEY_FONT
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.1,threshold+0.03 font @ANN_FONT
# set style textbox 1 opaque fc "yellow" noborder
# set label 2 sprintf("N=%d", NETWORKSIZE) boxed bs 1 textcolor rgbcolor "steelblue" at 3.5,0.95 font @ANN_FONT

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename("none")      u ($1/1000):3  w lines lt 1 lc 2 lw 2   t legendname("none"),\
     filename("random")    u ($1/1000):3  w lines lt 0 lc 7 lw 3   t legendname("random"),\
     filename("degree")    u ($1/1000):3  w lines lt 2 lc 4 lw 2   t legendname("degree"),\
     filename("between")   u ($1/1000):3  w lines lt 3 lc 3 lw 2   t legendname("betweenness"),\
     filename("closeness") u ($1/1000):3  w lines lt 4 lc 1 lw 2   t legendname("closeness"),\
     filename("eigen")     u ($1/1000):3  w lines lt 5 lc 5 lw 2   t legendname("eigenvector")
