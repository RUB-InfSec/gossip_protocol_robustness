set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("MODEL")) MODEL = "push"
if (!exists("CHURN")) CHURN = "c0"
if (!exists("DEGREE")) DEGREE = 8
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
if (!exists("ADVERSARY")) ADVERSARY = "degree"

# *.csv: coverage, delay, sentBytes, #relay, #onlineNodes, blkStayTime 
# budget = 0.1:  2-7
# budget = 0.2:  8-13
# budget = 0.33: 14-19
# budget = 0.5:  20-25
# budget = 0.3:  26-31
# budget = 0.32: 32-37

# staticfn=sprintf("%s/%s-%s-d%d-%s-%s-%s-nochurns.csv", DIR, GOSSIP, MODEL, DEGREE, ADVERSARY, BEHAVIOR, MSG_SIZE)
filename(corrdelay)=sprintf("%s/%s-%s-d%d-%s-%s-%s-%s-adapt-delay%s.csv", DIR, GOSSIP, MODEL, DEGREE, ADVERSARY, BEHAVIOR, MSG_SIZE, CHURN, corrdelay)
plotname=sprintf("%s/ns_coverage-diff_delay-%s-%s-d%d-%s-%s-%s-%s-adapt.eps", DIR, GOSSIP, MODEL, DEGREE, ADVERSARY, BEHAVIOR, MSG_SIZE, CHURN)
legendname(bound, delay)=sprintf("{/Symbol b}=%s,{/Symbol d}=%dms", bound, delay)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [20:5000]
set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
set yrange [0:100]
set mytics 2
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
set tmargin 4
# set format x "%g %%"  # not work because use xtic in plot

#
#set key box top left height 0.6 spacing 1.2
set key outside top center
set key box lt 0 font ',21px' width -0.5 columns 2

threshold = 2.0/3.0*100
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,threshold + 3 font @ANN_FONT
set label 2 "NS bound" textcolor rgbcolor "gray40" at 22,50 + 3 font @ANN_FONT

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     50 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename("0.01") u 1:($2/$1*100) w linespoints lt 7  lc rgbcolor "khaki"        lw 2 pt 8  ps 2 t legendname("0.32",10),\
     filename("0.04") u 1:($2/$1*100) w linespoints lt 8  lc rgbcolor "gold"         lw 2 pt 13 ps 2 t legendname("0.32",40),\
     filename("0.05") u 1:($2/$1*100) w linespoints lt 9  lc rgbcolor "orange"       lw 2 pt 9  ps 2 t legendname("0.32",50),\
     filename("0.01") u 1:($8/$1*100) w linespoints lt 10 lc rgbcolor "light-pink"   lw 2 pt 4  ps 2 t legendname("0.5", 10),\
     filename("0.04") u 1:($8/$1*100) w linespoints lt 11 lc rgbcolor "light-coral"  lw 2 pt 14 ps 2 t legendname("0.5", 40),\
     filename("0.05") u 1:($8/$1*100) w linespoints lt 12 lc rgbcolor "red"          lw 2 pt 5  ps 2 t legendname("0.5", 50)
