set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000



filename(bound)=sprintf("coverage-corrdelay-ns%d-f%s.csv", NETWORKSIZE, bound)
plotname=sprintf("coverage-corrdelay-ns%d.eps", NETWORKSIZE)
legendname(bound)=sprintf("{/Symbol b}=%s", bound)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [:10]
# set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
# set mxtics
set yrange [0:100]
set mytics 2
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Corruption Delay (s)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
# set format x "%g %%"  # not work because use xtic in plot

#
#set key box top left height 0.6 spacing 1.2
set key box lt 0 bottom right font @KEY_FONT

threshold = 2.0/3.0*100
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.1,threshold + 3 font @ANN_FONT
set label 2 "NS bound" textcolor rgbcolor "gray40" at 0.1,50 + 3 font @ANN_FONT
set label 3 "80%" textcolor rgbcolor "gray40" at 0.1,80 + 3 font @ANN_FONT

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     50 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     80 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename("0.2") u 1:($2/NETWORKSIZE*100) w linespoints lt 7  lc rgbcolor "medium-blue" lw 2 pt 8  ps 2 t legendname("0.2"),\
     filename("0.3") u 1:($2/NETWORKSIZE*100) w linespoints lt 8  lc rgbcolor "orange"      lw 2 pt 13 ps 2 t legendname("0.3"),\
     filename("0.5") u 1:($2/NETWORKSIZE*100) w linespoints lt 9  lc rgbcolor "red"         lw 2 pt 9  ps 2 t legendname("0.5")
