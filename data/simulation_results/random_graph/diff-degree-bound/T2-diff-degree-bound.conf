set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#

if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("MODEL")) MODEL = "push"
if (!exists("CHURN")) CHURN = "nochurn"
# if (!exists("CHURN")) CHURN = "c0"
if (!exists("ADVERSARY")) ADVERSARY = "degree"
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
# if (!exists("ADAPTIVE")) ADAPTIVE = "-adapt"
# if (!exists("CORR_DELAY")) CORR_DELAY = "-delay1"
if (!exists("ADAPTIVE")) ADAPTIVE = ""
if (!exists("CORR_DELAY")) CORR_DELAY = ""

# *.csv: coverage, delay, sentBytes, #relay, #onlineNodes, blkStayTime 
# budget = 0:    2-7
# budget = 0.1:  8-13
# budget = 0.2:  14-19
# budget = 0.33: 20-25
# budget = 0.5:  26-31
# budget = 0.3:  32-37
# budget = 0.32: 38-43

networkstatsfile=sprintf("stats_online_nodes_%s.csv", CHURN)
filename(deg)=sprintf("%s/%s-%s-d%d-%s-%s-%s-%s%s%s.csv", DIR, GOSSIP, MODEL, deg, ADVERSARY, BEHAVIOR, MSG_SIZE, CHURN, ADAPTIVE, CORR_DELAY)
plotname=sprintf("%s/ns_coverage-diff_degree_bound-%s-%s-%s-%s-%s-%s%s%s-d8.eps", DIR, GOSSIP, MODEL, ADVERSARY, BEHAVIOR, MSG_SIZE, CHURN, ADAPTIVE, CORR_DELAY)
legendname(bound, deg)=sprintf("{/Symbol b}=%s, d=%d", bound, deg)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [20:5000]
set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
# set yrange [*:105]
set yrange [10:100]
# set mytics 4
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4

threshold = 2.0/3.0*100
#f=0.33,0.32
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,threshold+4 font @ANN_FONT
# set label 2 "NS bound" textcolor rgbcolor "gray40" at 22,50+4 font @ANN_FONT
#f=0.3
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,threshold-3 font @ANN_FONT
set label 2 "NS bound" textcolor rgbcolor "gray40" at 22,50-4 font @ANN_FONT


#set key box top left height 0.6 spacing 1.2
if (CHURN eq "nochurn") {
    set key box lt 0 bottom center maxrows 3 width -1 font @KEY_FONT
    plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
         50 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
         filename(8)  u 1:($32/$1*100) w linespoints lt 0  lc rgbcolor "khaki"       lw 3 pt 8  ps 2 t legendname("0.3", 8),\
         filename(15) u 1:($32/$1*100) w linespoints lt 12 lc rgbcolor "gold"        lw 2 pt 12 ps 2 t legendname("0.3", 15),\
         filename(20) u 1:($32/$1*100) w linespoints lt 2  lc rgbcolor "orange"      lw 2 pt 9  ps 2 t legendname("0.3", 20),\
         filename(8)  u 1:($26/$1*100) w linespoints lt 3  lc rgbcolor "light-pink"  lw 2 pt 4  ps 2 t legendname("0.5", 8),\
         filename(15) u 1:($26/$1*100) w linespoints lt 4  lc rgbcolor "light-coral" lw 2 pt 14 ps 2 t legendname("0.5", 15),\
         filename(20) u 1:($26/$1*100) w linespoints lt 5  lc rgbcolor "red"         lw 2 pt 5  ps 2 t legendname("0.5", 20)
#          filename(8)  u 1:($20/$1*100) w linespoints lt 0  lc rgbcolor "khaki"       lw 3 pt 8  ps 2 t legendname("0.33", 8),\
#          filename(15) u 1:($20/$1*100) w linespoints lt 12 lc rgbcolor "gold"        lw 2 pt 12 ps 2 t legendname("0.33", 15),\
