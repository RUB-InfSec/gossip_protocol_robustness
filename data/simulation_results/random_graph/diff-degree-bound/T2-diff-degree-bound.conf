} else {
    set key box lt 0 bottom center maxrows 3 width -2.5 font ',18px'
    plot 67 w lines lt 6 lc rgbcolor "gray50" lw 1 notitle,\
         50 w lines lt 6 lc rgbcolor "gray50" lw 1 notitle,\
         networkstatsfile u 1:($2/$1*100) w linespoints lt 9 lc rgbcolor "sea-green" lw 2 pt 3  ps 2 t "{/Symbol b}=0",\
         filename(10) u 1:($8/$1*100)  w linespoints lt 6 lc rgbcolor "plum"         lw 2 pt 6  ps 2 t legendname("0.1",10),\
         filename(20) u 1:($8/$1*100)  w linespoints lt 8 lc rgbcolor "dark-violet"  lw 2 pt 7  ps 2 t legendname("0.1",20),\
         filename(10) u 1:($14/$1*100) w linespoints lt 3 lc rgbcolor "light-blue"   lw 2 pt 10 ps 2 t legendname("0.2", 10),\
         filename(20) u 1:($14/$1*100) w linespoints lt 5 lc rgbcolor "medium-blue"  lw 2 pt 11 ps 2 t legendname("0.2", 20),\
         filename(10) u 1:($20/$1*100) w linespoints lt 0 lc rgbcolor "khaki"        lw 3 pt 8  ps 2 t legendname("0.33", 10),\
         filename(20) u 1:($20/$1*100) w linespoints lt 2 lc rgbcolor "orange"       lw 2 pt 9  ps 2 t legendname("0.33", 20),\
         filename(10) u 1:($26/$1*100) w linespoints lt 3 lc rgbcolor "light-pink"   lw 2 pt 4  ps 2 t legendname("0.5", 10),\
         filename(20) u 1:($26/$1*100) w linespoints lt 5 lc rgbcolor "red"          lw 2 pt 5  ps 2 t legendname("0.5", 20)
