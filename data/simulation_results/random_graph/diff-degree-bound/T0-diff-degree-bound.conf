set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic

if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."

if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000
if (!exists("MODEL")) MODEL = "push"
if (!exists("CHURN")) CHURN = "nochurn"
if (!exists("ADVERSARY")) ADVERSARY = "degree" 
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
if (!exists("ADAPTIVE")) ADAPTIVE = "" #"-adapt"
if (!exists("CORR_DELAY")) CORR_DELAY = "" #"-delay1"

filename(deg, bound)=sprintf("%s/latency-%s-%s-ns%d-%s-d%d-f%s-%s-%s%s%s.csv", DIR, GOSSIP, MODEL, NETWORKSIZE, ADVERSARY, deg, bound, BEHAVIOR, CHURN, ADAPTIVE, CORR_DELAY)
noadfile(deg)=sprintf("%s/latency-%s-%s-ns%d-%s-d%d-%s.csv", DIR, GOSSIP, MODEL, NETWORKSIZE, "none", deg, CHURN)
# plotname=sprintf("%s/quality-diff_degree-%s-%s-ns%d-%s-f%s-%s-%s%s%s.eps", DIR, GOSSIP, MODEL, NETWORKSIZE, ADVERSARY, BUDGET, BEHAVIOR, CHURN, ADAPTIVE, CORR_DELAY)
plotname=sprintf("%s/robust-diff_degree_bound-%s-%s-ns%d-%s-%s-%s%s%s-d8.eps", DIR, GOSSIP, MODEL, NETWORKSIZE, ADVERSARY, BEHAVIOR, CHURN, ADAPTIVE, CORR_DELAY)
legendname(bound,deg)=sprintf("{/Symbol b}=%s, d=%d", bound, deg)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set xrange[0:7.0]
set yrange[*:1.0]
# set mytics 4
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20 
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics 0, 0.2, 1.0 font @TICS_FONT
set mytics 2
set xlabel "Propagation Time t (s)" font @LABEL_FONT offset 0,-0.5
set ylabel "Quality (t)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
#
#set key box top left height 0.6 spacing 1.2
set key box lt 0 top center width -1 maxrows 3 font @KEY_FONT
# set key box lt 0 bottom right font @KEY_FONT

threshold = 0.667
#f=0.3, 0.32
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 5.5,threshold+0.03 font @ANN_FONT
set label 2 "NS bound" textcolor rgbcolor "gray40" at 5.6,0.5+0.03 font @ANN_FONT
#f=0.33
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.1,threshold+0.03 font @ANN_FONT
# set label 2 "NS bound" textcolor rgbcolor "gray40" at 0.1,0.5+0.03 font @ANN_FONT
#

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     0.5  w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
