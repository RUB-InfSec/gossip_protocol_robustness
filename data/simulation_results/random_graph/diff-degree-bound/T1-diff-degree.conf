set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("MODEL")) MODEL = "push"
if (!exists("CHURN")) CHURN = "nochurn"
if (!exists("ADVERSARY")) ADVERSARY = "degree"
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
if (!exists("ADAPTIVE")) ADAPTIVE = "-adapt"
if (!exists("CORR_DELAY")) CORR_DELAY = "-delay1"
if (!exists("BUDGET")) BUDGET = "0.33"

# *.csv: coverage, delay, sentBytes, #relay, #onlineNodes, blkStayTime 
# budget = 0:    2-7
# budget = 0.1:  8-13
# budget = 0.2:  14-19
# budget = 0.33: 20-25
# budget = 0.5:  26-31
if (BUDGET eq "0.1") {
    ind = 9
} else {
    if (BUDGET eq "0.2") {
        ind = 15
    } else {
        if (BUDGET eq "0.33") {
            ind = 21 
        } else {
            if (BUDGET eq "0.5") {
                ind = 27
            } else {
                ind = -1
            }
        }
    }
}

filename(deg)=sprintf("%s/%s-%s-d%d-%s-%s-%s-%s%s%s.csv", DIR, GOSSIP, MODEL, deg, ADVERSARY, BEHAVIOR, MSG_SIZE, CHURN, ADAPTIVE, CORR_DELAY)
plotname=sprintf("%s/ns_delay-diff_degree-%s-%s-%s-%s-%s-%s-f%s%s%s.eps", DIR, GOSSIP, MODEL, ADVERSARY, BEHAVIOR, MSG_SIZE, CHURN, BUDGET, ADAPTIVE, CORR_DELAY)
legendname(adv, deg)=sprintf("%s,deg=%d", adv, deg)
set output plotname

# set terminal x11
set macros
LABEL_FONT = "\",23px\""
TICS_FONT = "\",22px\""
KEY_FONT = "\",28px\""

set logscale x
# set mytics 4
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
# set ylabel "Latency (ms)" font ",30px" offset 1.5, 0
set xlabel "Network Size (n)" font @LABEL_FONT
#set xlabel "Number of replicas" font @LABEL_FONT
set ylabel "Propagation Delay (s)" font @LABEL_FONT
# set format x "%g %%"  # not work because use xtic in plot
#
# set title "Network size vs. Delay"

#
#set key box top left height 0.6 spacing 1.2
set key box lt 0 top left
plot filename(10) u 1:3             with linespoints lt 0 lc 4 lw 1 pt 6 ps 1.5 t legendname("f=0",10),\
     filename(15) u 1:3             with linespoints lt 1 lc 5 lw 1 pt 3 ps 1.5 t legendname("f=0",15),\
     filename(20) u 1:3             with linespoints lt 2 lc 7 lw 1 pt 8 ps 1.5 t legendname("f=0",20),\
     filename(10) u 1:(column(ind)) with linespoints lt 3 lc 2 lw 1 pt 6 ps 1.5 t legendname(sprintf("f=%s", BUDGET), 10),\
     filename(15) u 1:(column(ind)) with linespoints lt 4 lc 3 lw 1 pt 3 ps 1.5 t legendname(sprintf("f=%s", BUDGET), 15),\
     filename(20) u 1:(column(ind)) with linespoints lt 5 lc 1 lw 1 pt 8 ps 1.5 t legendname(sprintf("f=%s", BUDGET), 20)

