set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic

if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."

if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000
if (!exists("MODEL")) MODEL = "push"
if (!exists("DEGREE")) DEGREE = 8
if (!exists("CHURN")) CHURN = "nochurn"
if (!exists("ADVERSARY")) ADVERSARY = "degree" 
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"
if (!exists("ADAPTIVE")) ADAPTIVE = "" #"-adapt"
if (!exists("CORR_DELAY")) CORR_DELAY = "" #"-delay1"

filename(budget)=sprintf("%s/latency-%s-%s-ns%d-%s-d%d-f%s-%s-%s%s%s.csv", DIR, GOSSIP, MODEL, NETWORKSIZE, ADVERSARY, DEGREE, budget, BEHAVIOR, CHURN, ADAPTIVE, CORR_DELAY)
noadfile=sprintf("%s/latency-%s-%s-ns%d-%s-d%d-%s.csv", DIR, GOSSIP, MODEL, NETWORKSIZE, "none", DEGREE, CHURN)
plotname=sprintf("%s/robust-diff_bound-%s-%s-ns%d-d%d-%s-%s-%s%s%s.eps", DIR, GOSSIP, MODEL, NETWORKSIZE, DEGREE, ADVERSARY, BEHAVIOR, CHURN, ADAPTIVE, CORR_DELAY)
legendname(budget)=sprintf("{/Symbol b}=%s", budget)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set xrange[0:6.0]
set yrange[*:1.0]
# set mytics 4
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
set xtics font @TICS_FONT
set ytics 0, 0.2, 1.0 font @TICS_FONT
set mytics 2
set xlabel "Propagation Time t (s)" font @LABEL_FONT offset 0,-0.5
set ylabel "Quality (t)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
#
#set key box top left height 0.6 spacing 1.2
set key box lt 0 bottom right font @KEY_FONT

threshold=0.667
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 4.7,threshold+0.02 font @ANN_FONT
set label 2 "NS bound" textcolor rgbcolor "gray40" at 4.8,0.5+0.02 font @ANN_FONT

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     0.5 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename("0.3")  u ($1/1000):3  w lines lt 5 lc rgbcolor "forest-green" lw 2 t legendname("0.3"),\
     filename("0.32") u ($1/1000):3  w lines lt 2 lc rgbcolor "medium-blue"  lw 2 t legendname("0.32"),\
     filename("0.33") u ($1/1000):3  w lines lt 3 lc rgbcolor "orange"       lw 2 t legendname("0.33"),\
     filename("0.5")  u ($1/1000):3  w lines lt 4 lc rgbcolor "red"          lw 2 t legendname("0.5")

