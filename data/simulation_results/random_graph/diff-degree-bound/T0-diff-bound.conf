#      filename("0.1")  u ($1/1000):3  w lines lt 2 lc 9 lw 2 t legendname("0.1"),\
#      filename("0.2")  u ($1/1000):3  w lines lt 3 lc 3 lw 2 t legendname("0.2"),\
