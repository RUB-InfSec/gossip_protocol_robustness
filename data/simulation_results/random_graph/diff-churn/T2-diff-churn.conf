set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
#
#

if (!exists("GOSSIP")) GOSSIP = "er"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000
if (!exists("MODEL")) MODEL = "push"
if (!exists("DEGREE")) DEGREE = 8
if (!exists("ADVERSARY")) ADVERSARY = "degree"
if (!exists("BEHAVIOR")) BEHAVIOR = "crash"

# coverage-er-push-ns1000-d10-random-crash-80KB.csv: \rho=0, \rho=0.1, \rho=0.2, \rho=0.33, \rho=0.5
# budget = 0:    2
# budget = 0.1:  3
# budget = 0.2:  4
# budget = 0.33: 5
# budget = 0.5:  6
# budget = 0.3:  7
# budget = 0.32: 8

filename(deg)=sprintf("%s/coverage-%s-%s-ns%d-d%d-%s-%s-%s.csv", DIR, GOSSIP, MODEL, NETWORKSIZE, deg, ADVERSARY, BEHAVIOR, MSG_SIZE)
plotname=sprintf("%s/churn_coverage-diff_degree_bound-%s-%s-ns%d-%s-%s-%s.eps", DIR, GOSSIP, MODEL, NETWORKSIZE, ADVERSARY, BEHAVIOR, MSG_SIZE)
legendname(bound, deg)=sprintf("{/Symbol b}=%s, d=%d", bound, deg)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set xrange [0:0.5]
set xtics add ("5" 0.05, "10" 0.1, "20" 0.2, "30" 0.3, "40" 0.4, "50" 0.5)  # fixed list
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Churn Rate (%)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4

threshold = 66.7
#f=0.33
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.01,threshold+2 font @ANN_FONT
# set label 2 "NS bound" textcolor rgbcolor "gray40" at 0.01,50+2 font @ANN_FONT
#f=0.3
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.01,threshold+3 font @ANN_FONT
set label 2 "NS bound" textcolor rgbcolor "gray40" at 0.01,50+2.2 font @ANN_FONT
#f=0.32
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.01,threshold+2.2 font @ANN_FONT
# set label 2 "NS bound" textcolor rgbcolor "gray40" at 0.01,50+2.2 font @ANN_FONT
#
set key box lt 0 bottom left maxrows 4 width -2 font ',19px'

set yrange [20:100]

