set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
#
#

if (!exists("GOSSIP")) GOSSIP = "polkadot"
if (!exists("DIR")) DIR = "."
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"

if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000

# coverage-polkadot-ns1000-80KB.csv: \rho=0, \rho=0.1, \rho=0.2, \rho=0.33, \rho=0.5
# budget = 0:    2
# budget = 0.1:  3
# budget = 0.2:  4
# budget = 0.33: 5
# budget = 0.5:  6
# budget = 0.3:  7
# budget = 0.32: 8

filename=sprintf("%s/coverage-%s-ns%d-%s.csv", DIR, GOSSIP, NETWORKSIZE, MSG_SIZE)
plotname=sprintf("%s/churn_coverage-diff_bound-%s-ns%d-%s.eps", DIR, GOSSIP, NETWORKSIZE, MSG_SIZE)
legendname(bound)=sprintf("{/Symbol b}=%s", bound)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set xrange [0:0.5]
set xtics add ("5" 0.05, "10" 0.1, "20" 0.2, "30" 0.3, "40" 0.4, "50" 0.5)  # fixed list
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Churn Rate (%)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4

threshold = 66.7
# f=0.33, 0.32
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.01,threshold+2.2 font @ANN_FONT
# f=0.3
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 0.01,66.7-2.2 font @ANN_FONT

set label 2 "NS bound" textcolor rgbcolor "gray40" at 0.01,50+2 font @ANN_FONT
#
set key box lt 0 bottom center maxrows 2 font @KEY_FONT

set yrange [20:100]

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     50 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename u 1:($2/NETWORKSIZE*100) w linespoints lt 9 lc rgbcolor "sea-green"    lw 2 pt 3  ps 2 t "{/Symbol b}=0",\
     filename u 1:($4/NETWORKSIZE*100) w linespoints lt 5 lc rgbcolor "medium-blue"  lw 2 pt 11 ps 2 t legendname("0.2"),\
     filename u 1:($7/NETWORKSIZE*100) w linespoints lt 2 lc rgbcolor "orange"       lw 2 pt 9  ps 2 t legendname("0.3"),\
     filename u 1:($6/NETWORKSIZE*100) w linespoints lt 5 lc rgbcolor "red"          lw 2 pt 5  ps 2 t legendname("0.5")
#      filename u 1:($3/NETWORKSIZE*100) w linespoints lt 8 lc rgbcolor "dark-violet"  lw 2 pt 7  ps 2 t legendname("0.1"),\
#      filename u 1:($8/NETWORKSIZE*100) w linespoints lt 2 lc rgbcolor "orange"       lw 2 pt 9  ps 2 t legendname("0.32"),\
#      filename u 1:($5/NETWORKSIZE*100) w linespoints lt 2 lc rgbcolor "orange"       lw 2 pt 9  ps 2 t legendname("0.33"),\
