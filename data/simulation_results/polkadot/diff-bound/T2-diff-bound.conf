set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i

if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"
if (!exists("GOSSIP")) GOSSIP = "polkadot"
if (!exists("DIR")) DIR = "."
if (!exists("CHURN")) CHURN = "nochurn"

filename=sprintf("%s/%s-%s-%s.csv", DIR, GOSSIP, MSG_SIZE, CHURN)
plotname=sprintf("%s/ns_coverage-diff_bound-%s-%s-%s.eps", DIR, GOSSIP, MSG_SIZE, CHURN)
legendname(budget)=sprintf("{/Symbol b}=%s", budget)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [20:5000]
set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
set yrange [40:105]
set style line 12 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 12
set grid ytics mytics back ls 12
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 12
set rmargin 4
set bmargin 5 

set key box lt 0 top center font @KEY_FONT maxrows 2

threshold = 2.0/3.0 * 100
#f=0.33
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,threshold + 3 font @ANN_FONT
#f=0.3
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,threshold - 2 font @ANN_FONT

plot threshold w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename u 1:($20/$1*100) w linespoints lt 2 lc rgbcolor "orange" lw 2 pt 9 ps 2 t legendname("0.33"),\
     filename u 1:($26/$1*100) w linespoints lt 5 lc rgbcolor "red"    lw 2 pt 5 ps 2 t legendname("0.5")
