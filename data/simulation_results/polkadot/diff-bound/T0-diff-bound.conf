set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("GOSSIP")) GOSSIP = "polkadot"
if (!exists("DIR")) DIR = "."

if (!exists("NETWORKSIZE")) NETWORKSIZE = 1000
if (!exists("CHURN")) CHURN = "nochurn"

filename(budget)=sprintf("%s/latency-%s-ns%d-%s-%s.csv", DIR, GOSSIP, NETWORKSIZE, budget, CHURN)
plotname=sprintf("%s/robust-diff_bound-%s-ns%d-%s.eps", DIR, GOSSIP, NETWORKSIZE, CHURN)
legendname(budget)=sprintf("{/Symbol b}=%s", budget)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set xrange[0:4]
set yrange[*:1.0]
# set mytics 4
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics 0, 0.2, 1.0 font @TICS_FONT
set mytics 2
set style line 12 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 12
set grid ytics mytics back ls 12
set xlabel "Propagation Time t (s)" font @LABEL_FONT offset 0,-0.5
set ylabel "Quality (t)" font @LABEL_FONT offset -1,0
set lmargin 12
set rmargin 4
set bmargin 5 
#
set key box lt 0 bottom right font @KEY_FONT

threshold=0.667
set label 1 "BFT bound" textcolor rgbcolor "gray40" at 3,threshold+0.025 font @ANN_FONT

plot 0.67 w lines lt 6 lc rgbcolor "gray40" lw 1 notitle,\
     filename("none")  u ($1/1000):3  w lines lt 1 lc 2 lw 2 t legendname("0"),\
     filename("f0.33") u ($1/1000):3  w lines lt 2 lc rgbcolor "orange" lw 2 t legendname("0.33"),\
     filename("f0.5")  u ($1/1000):3  w lines lt 5 lc rgbcolor "red" lw 2 t legendname("0.5")

#      filename("f0.1")  u ($1/1000):3  w lines lt 2 lc 7 lw 2 t legendname("0.1"),\
#      filename("f0.2")  u ($1/1000):3  w lines lt 3 lc 4 lw 2 t legendname("0.2"),\


