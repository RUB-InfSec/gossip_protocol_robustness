set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("DIR")) DIR = "."
if (!exists("GOSSIP")) GOSSIP = "polkadot"
if (!exists("MSG_SIZE")) MSG_SIZE = "80KB"
if (!exists("CHURN")) CHURN = "nochurn"

filename=sprintf("%s/%s-%s-%s.csv", DIR, GOSSIP, MSG_SIZE, CHURN)
plotname=sprintf("%s/ns_delay-diff_bound-%s-%s-%s.eps", DIR, GOSSIP, MSG_SIZE, CHURN)
legendname(f)=sprintf("{/Symbol b}=%s", f)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [20:5000]
set xtics add ("20" 20, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
# set mytics 4
set style line 12 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 12
set grid ytics mytics back ls 12
# set key spacing 1.5 width 3.5 height 0.6
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Delay {/Symbol D} (s)" font @LABEL_FONT offset -1,0
set lmargin 12
set rmargin 4
set bmargin 5 


set key box lt 0 top left font @KEY_FONT
plot filename u 1:3  with linespoints lt 1 lc 2 lw 2 pt 6 ps 2 t legendname("0"),\
     filename u 1:21 with linespoints lt 2 lc rgbcolor "orange" lw 2 pt 9 ps 2 t legendname("0.33"),\
     filename u 1:27 with linespoints lt 5 lc rgbcolor "red"    lw 2 pt 5 ps 2 t legendname("0.5")   
#      filename u 1:39 with linespoints lt 2 lc rgbcolor "orange" lw 2 pt 9 ps 2 t legendname("0.32"),\
#      filename u 1:33 with linespoints lt 2 lc rgbcolor "orange" lw 2 pt 9 ps 2 t legendname("0.3"),\
#
#      filename u 1:9  with linespoints lt 2 lc 7 lw 2 pt 3 ps 2 t legendname("0.1"),\
