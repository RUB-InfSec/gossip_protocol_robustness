set terminal postscript eps dashed color enhanced font 'Helvetica,18' linewidth 3
set for [i=1:8] linetype i dashtype i
# set colorsequenc classic
#
#
#
if (!exists("GOSSIP")) GOSSIP = "gossipsub"
if (!exists("DIR")) DIR = "."

filename(dropinterval)=sprintf("%s/mincoverage-dropinterval%s.csv", DIR, dropinterval)
plotname=sprintf("%s/ns_coverage-diff_droprate-%s-f0.33-1.eps", DIR, GOSSIP)
legendname(dropinterval)=sprintf("{/Symbol x}=1/%s", dropinterval)
set output plotname

# set terminal x11
set macros
TICS_FONT = "\",24px\""
LABEL_FONT = "\",26px\""
KEY_FONT = "\",24px\""
ANN_FONT = "\",24px\""

set logscale x
set xrange [50:5000]
set xtics add ("50" 50, "100" 100, "1000" 1000, "5000" 5000)  # fixed list
set mxtics
# set yrange [0:100]
set mytics 2
set style line 20 lc rgbcolor 'gray60' lt 0 lw 1
set grid xtics back ls 20
set grid ytics mytics back ls 20
set xtics font @TICS_FONT
set ytics font @TICS_FONT
set xlabel "Network Size (n)" font @LABEL_FONT offset 0,-0.5
set ylabel "Coverage {/Symbol W} (%)" font @LABEL_FONT offset -1,0
set lmargin 10
set rmargin 4
set bmargin 4
# set format x "%g %%"  # not work because use xtic in plot

#
set key box lt 0 bottom right columns 2 samplen 3 width -0.5 font @KEY_FONT

# threshold = 66.7
# set label 1 "BFT bound" textcolor rgbcolor "gray40" at 22,threshold + 2 font @ANN_FONT

plot filename("2") u 1:($2/$1*100)      w linespoints lt 11 lc rgbcolor "web-blue"     lw 2 pt 12 ps 2 t legendname("2"),\
     filename("3") u 1:($2/$1*100)      w linespoints lt 7  lc rgbcolor "medium-blue"  lw 2 pt 8  ps 2 t legendname("3"),\
     filename("4") u 1:($2/$1*100)      w linespoints lt 8  lc rgbcolor "light-green"  lw 2 pt 9  ps 2 t legendname("4"),\
     filename("5") u 1:($2/$1*100)      w linespoints lt 9  lc rgbcolor "forest-green" lw 2 pt 4  ps 2 t legendname("5"),\
     filename("6") u 1:($2/$1*100)      w linespoints lt 10 lc rgbcolor "gold"         lw 2 pt 5  ps 2 t legendname("6"),\
     filename("7") u 1:($2/$1*100)      w linespoints lt 3  lc rgbcolor "orange"       lw 2 pt 6  ps 2 t legendname("7"),\
     filename("8") u 1:($2/$1*100)      w linespoints lt 3  lc rgbcolor "dark-pink"    lw 2 pt 7  ps 2 t legendname("8"),\
     filename("9") u 1:($2/$1*100)      w linespoints lt 4  lc rgbcolor "red"          lw 2 pt 10 ps 2 t legendname("9"),\
     filename("10") u 1:($2/$1*100)     w linespoints lt 5  lc rgbcolor "violet"       lw 2 pt 11 ps 2 t legendname("10")

